name: Refresh RSS
on:
  push:
    paths: [events.json, generate-rss.mjs, .github/workflows/refresh-rss.yml]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rss-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node generate-rss.mjs
      - run: |
          git config user.name "NPLH RSS"
          git config user.email "noehome24-jpg@users.noreply.github.com"
          git add rss.xml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh upcoming events RSS"
          git push
